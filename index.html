<!DOCTYPE html>
<html lang="es" data-publica>
<head>
    <meta charset="UTF-8">
    <title>Portal Docente</title>
    <link rel="stylesheet" href="css/index.css">
    <script src="js/sesion.js"></script>

</head>

<body>
    <main class="login">
        <div class="login-contenedor">
            <div class="logo">
                <img src="img/images.png" alt="imagen del logo">
            </div>
            <h1>Portal Docente</h1>
            <p class="descripcion">
                Ingresa con tus credenciales para continuar
            </p>
            <form id="formLogin">
                <div class="campo">
                    <label for="usuario">Usuario</label>
                    <input type="text" 
                           id="usuario" 
                           name="user" autocomplete="username" autofocus required>
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" 
                           id="password" 
                           name="password" autocomplete="current-password" required>
                </div>
                <div class="opciones">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit">
                    Ingresar
                </button>
                <p id="mensaje" role="alert" aria-live="polite"></p>
            </form>
        </div>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
